<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="洪瑶｜中国安全生产科学研究院科研主页">
  <title>洪瑶｜科研主页</title>
  <style>
    :root { --ink:#1c2935; --muted:#5d6b78; --line:#dfe6eb; --blue:#146c94; --pale:#eef7fa; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); font:16px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; background:#fff; }
    header { background:linear-gradient(125deg,#123b55,#17799b); color:#fff; padding:76px 24px 62px; }
    .wrap { max-width:940px; margin:auto; }
    h1 { margin:0 0 8px; font-size:42px; letter-spacing:.04em; }
    header p { margin:0; font-size:18px; opacity:.92; }
    nav { margin-top:28px; display:flex; gap:20px; flex-wrap:wrap; }
    nav a { color:#fff; text-decoration:none; opacity:.9; }
    main { padding:44px 24px 60px; }
    section { padding:8px 0 32px; border-bottom:1px solid var(--line); }
  section:last-child { border:0; }
    h2 { color:var(--blue); font-size:24px; margin:0 0 16px; }
    p { margin:0 0 12px; }
    .tags { display:flex; gap:10px; flex-wrap:wrap; }
    .tags span { padding:5px 13px; background:var(--pale); color:#155b78; border-radius:999px; font-size:14px; }
    .contact { display:grid; grid-template-columns:120px 1fr; gap:8px 16px; }
    a { color:#106c95; }
    footer { color:var(--muted); text-align:center; padding:24px; background:#f6f8f9; font-size:14px; }
    @media (max-width:600px) { h1 { font-size:34px; } header { padding:56px 24px 46px; } .contact { grid-template-columns:1fr; gap:0; } }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>洪瑶</h1>
      <p>中国安全生产科学研究院</p>
      <nav><a href="#about">简介</a><a href="#research">研究方向</a><a href="#publications">学术成果</a><a href="#contact">联系方式</a></nav>
    </div>
  </header>
  <main class="wrap">
    <section id="about">
      <h2>个人简介</h2>
      <p>洪瑶，中国安全生产科学研究院。关注城市复杂系统中的安全风险识别、火灾与流动过程模拟，以及安全韧性提升。</p>
    </section>
    <section id="research">
      <h2>研究方向</h2>
      <div class="tags"><span>城市安全</span><span>计算流体力学</span><span>消防安全</span></div>
    </section>
    <section id="publications">
      <h2>学术成果</h2>
      <p>论文、项目与学术报告将陆续更新。</p>
    </section>
    <section id="contact">
      <h2>联系方式</h2>
      <div class="contact">
        <strong>电子邮箱</strong><a href="mailto:hongyao@chinasafety.ac.cn">hongyao@chinasafety.ac.cn</a>
        <strong>微信</strong><span>hongyao_jx</span>
        <strong>QQ</strong><span>654043231</span>
      </div>
    </section>
  </main>
  <footer>© 洪瑶 · 中国安全生产科学研究院</footer>
</body>
</html>
